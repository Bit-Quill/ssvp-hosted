<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowflake OAuth Callback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #29B5E8 0%, #1E88E5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .snowflake-logo {
      font-size: 64px;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      opacity: 0.95;
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success-icon {
      font-size: 72px;
      color: #4CAF50;
      margin-bottom: 1rem;
      display: none;
    }

    .success-icon.show {
      display: block;
      animation: successPop 0.5s ease-out;
    }

    @keyframes successPop {
      0% { transform: scale(0); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      display: none;
    }

    .error.show {
      display: block;
    }

    .error h2 {
      font-size: 20px;
      margin-bottom: 0.75rem;
      color: #ffcdd2;
    }

    .error-details {
      font-size: 14px;
      opacity: 0.9;
      font-family: 'Courier New', monospace;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.75rem;
      border-radius: 4px;
      word-break: break-word;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1.5rem;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="snowflake-logo">❄️</div>

    <div id="loading-state">
      <h1 id="status-title">Completing Authentication...</h1>
      <p id="status-message">Please wait while we complete your Snowflake login.</p>
      <div class="spinner"></div>
    </div>

    <div id="success-state" style="display: none;">
      <div class="success-icon show">✓</div>
      <h1>Success!</h1>
      <p>You're connected to Snowflake.</p>
      <p style="margin-top: 1rem; font-size: 14px; opacity: 0.8;">
        This window will close automatically...
      </p>
    </div>

    <div id="error-container" class="error">
      <h2>Authentication Error</h2>
      <p class="error-details" id="error-message"></p>
    </div>

    <div class="info-box" id="info-box" style="display: none;">
      <strong>Debug Info:</strong><br>
      Integration: SNOWFLAKE$LOCAL_APPLICATION<br>
      Redirect: http://127.0.0.1:3000/auth/callback
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      const loadingState = document.getElementById('loading-state');
      const successState = document.getElementById('success-state');
      const errorContainer = document.getElementById('error-container');
      const errorMessage = document.getElementById('error-message');
      const infoBox = document.getElementById('info-box');

      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        infoBox.style.display = 'block';
      }

      function showError(title, message) {
        loadingState.style.display = 'none';
        successState.style.display = 'none';
        errorContainer.classList.add('show');
        errorMessage.textContent = message;
      }

      function showSuccess() {
        loadingState.style.display = 'none';
        successState.style.display = 'block';
      }

      function sendMessageToOpener(data) {
        if (!window.opener || window.opener.closed) {
          showError(
            'Window Closed',
            'The Excel add-in window was closed. Please try connecting again.'
          );
          return false;
        }

        try {
          window.opener.postMessage(data, window.location.origin);
          return true;
        } catch (err) {
          showError(
            'Communication Error',
            'Failed to communicate with Excel add-in: ' + err.message
          );
          return false;
        }
      }

      function handleCallback() {
        if (error) {
          const errorMsg = errorDescription || error || 'Unknown authentication error';

          sendMessageToOpener({
            type: 'SNOWFLAKE_AUTH_ERROR',
            error: errorMsg,
            errorCode: error
          });

          showError('Authentication Failed', errorMsg);
          return;
        }

        if (!code) {
          const errorMsg = 'No authorization code received from Snowflake';

          sendMessageToOpener({
            type: 'SNOWFLAKE_AUTH_ERROR',
            error: errorMsg
          });

          showError('Invalid Response', errorMsg);
          return;
        }

        if (!state) {
          const errorMsg = 'No state parameter received (CSRF protection missing)';

          sendMessageToOpener({
            type: 'SNOWFLAKE_AUTH_ERROR',
            error: errorMsg
          });

          showError('Invalid Response', errorMsg);
          return;
        }

        const messageSent = sendMessageToOpener({
          type: 'SNOWFLAKE_AUTH_SUCCESS',
          code: code,
          state: state,
          integration: 'SNOWFLAKE$LOCAL_APPLICATION'
        });

        if (messageSent) {
          showSuccess();

          setTimeout(() => {
            try {
              window.close();
            } catch (err) {
              console.warn('Could not close window:', err);
            }
          }, 2000);
        }
      }

      try {
        if (window.opener && !window.opener.closed) {
          handleCallback();
        } else {
          showError(
            'Invalid Access',
            'This page should only be accessed during the OAuth login flow. ' +
            'Please close this window and try connecting to Snowflake again from Excel.'
          );
        }
      } catch (err) {
        showError(
          'Unexpected Error',
          'An unexpected error occurred: ' + (err.message || 'Unknown error')
        );
      }
    })();
  </script>
</body>
</html>
