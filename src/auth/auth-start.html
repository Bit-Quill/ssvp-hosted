<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Starting Authentication...</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #29B5E8 0%, #1E88E5 100%);
      color: white;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Redirecting to Snowflake...</h2>
    <p>Please wait</p>
  </div>

  <script>
    (function() {
      'use strict';

      // Get OAuth URL from query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const authUrl = urlParams.get('authUrl');

      if (!authUrl) {
        Office.context.ui.messageParent(JSON.stringify({
          type: 'SNOWFLAKE_AUTH_ERROR',
          error: 'No auth URL provided'
        }));
        return;
      }

      console.log('Redirecting to:', authUrl);

      // Redirect to Snowflake OAuth page
      // The callback will come to callback.html which will messageParent
      setTimeout(() => {
        window.location.href = authUrl;
      }, 500);
    })();
  </script>
</body>
</html>
